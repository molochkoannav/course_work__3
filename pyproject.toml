[project]
name = "course-work-3"
version = "0.1.0"
description = ""
authors = [
    {name = "Molochko_Anna"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2 (>=2.9.9,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "mypy (>=2.3.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.black]
line-length = 119
extend-exclude = '''
/(
    \.git
    | __pycache__
    | venv
    | \.venv
)/
'''


[tool.isort]
line_length = 119
profile = "black"
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude =  ['venv', '.venv']